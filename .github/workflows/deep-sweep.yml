name: Deep sweep

on:
  workflow_dispatch:
    inputs:
      window_days:
        required: false
        default: "7"
  push:
    paths:
      - "scripts/deep_sweep.py"
      - ".github/workflows/deep-sweep.yml"

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Resolve dates and fingerprint careers pages
        env:
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '7' }}
        run: python scripts/deep_sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-sweep-results
          path: data/deep_sweep_results.json
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deep_sweep_results.json
          git diff --staged --quiet || git commit -m "Deep sweep results [skip ci]"
          git pull --rebase --autostash || true
          git push
