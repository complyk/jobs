name: Validate job candidates

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Only keep roles first published within this many days"
        required: false
        default: "7"
  push:
    paths:
      - "data/candidates.json"
      - "scripts/validate_jobs.py"
      - ".github/workflows/validate-jobs.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Validate candidates and sweep ATS boards
        env:
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '7' }}
        run: python scripts/validate_jobs.py

      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: data/validation_results.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation_results.json
          git diff --staged --quiet || git commit -m "Validation results [skip ci]"
          git push
